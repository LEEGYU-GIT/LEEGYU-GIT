<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-label="이승규 · AI Engineer · Full-stack Developer · PM">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0A1020"/>
      <stop offset="0.55" stop-color="#0F1E36"/>
      <stop offset="1" stop-color="#14304F"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2DD4BF"/>
      <stop offset="1" stop-color="#60A5FA"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.78" cy="0.45" r="0.5">
      <stop offset="0" stop-color="#2DD4BF" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#2DD4BF" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#5B7BA6" stroke-width="0.6" opacity="0.18"/>
    </pattern>
    <clipPath id="frame"><rect width="1200" height="320" rx="18"/></clipPath>
  </defs>
  <style>
    .sans { font-family: 'Pretendard', 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', 'Segoe UI', sans-serif; }
    .mono { font-family: 'JetBrains Mono', 'Consolas', 'SFMono-Regular', monospace; }
    .in { opacity: 0; animation: in 0.9s cubic-bezier(.2,.7,.2,1) forwards; }
    .d1 { animation-delay: .15s } .d2 { animation-delay: .35s } .d3 { animation-delay: .55s }
    .d4 { animation-delay: .9s } .d5 { animation-delay: 1.1s } .d6 { animation-delay: 1.3s }
    @keyframes in { from { opacity: 0; transform: translateY(10px) } to { opacity: 1; transform: translateY(0) } }
    .role { opacity: 0; animation: cycle 12s infinite; }
    .r2 { animation-delay: 4s } .r3 { animation-delay: 8s }
    @keyframes cycle {
      0% { opacity: 0; transform: translateY(8px) }
      5%, 28% { opacity: 1; transform: translateY(0) }
      33%, 100% { opacity: 0; transform: translateY(-8px) }
    }
    .caret { animation: blink 1s steps(1) infinite; }
    @keyframes blink { 50% { opacity: 0 } }
    .track { stroke-dasharray: 2 12; animation: dash 3s linear infinite; }
    @keyframes dash { to { stroke-dashoffset: -56 } }
    .float1 { animation: float 7s ease-in-out infinite; }
    .float2 { animation: float 7s ease-in-out -2.3s infinite; }
    .float3 { animation: float 7s ease-in-out -4.6s infinite; }
    @keyframes float { 0%, 100% { transform: translateY(0) } 50% { transform: translateY(-6px) } }
    .pulse { animation: pulse 2.4s ease-out infinite; transform-origin: center; transform-box: fill-box; }
    @keyframes pulse { 0% { opacity: .7; transform: scale(1) } 100% { opacity: 0; transform: scale(2.6) } }
  </style>

  <g clip-path="url(#frame)">
    <rect width="1200" height="320" fill="url(#bg)"/>
    <rect width="1200" height="320" fill="url(#grid)"/>
    <rect width="1200" height="320" fill="url(#glow)"/>

    <!-- 주행 경로: 데이터가 흘러가는 길 -->
    <path id="route" d="M640 270 C 720 270, 730 190, 800 180 S 900 120, 960 120 S 1080 70, 1160 60"
          fill="none" stroke="#1F3B5E" stroke-width="22" stroke-linecap="round"/>
    <path d="M640 270 C 720 270, 730 190, 800 180 S 900 120, 960 120 S 1080 70, 1160 60"
          fill="none" stroke="#FBBF24" stroke-width="2" stroke-linecap="round" class="track" opacity="0.8"/>
    <circle r="7" fill="#2DD4BF">
      <animateMotion dur="7s" repeatCount="indefinite" rotate="auto" keyPoints="0;1" keyTimes="0;1" calcMode="linear">
        <mpath href="#route"/>
      </animateMotion>
    </circle>
    <circle r="7" fill="none" stroke="#2DD4BF" stroke-width="2" class="pulse">
      <animateMotion dur="7s" repeatCount="indefinite">
        <mpath href="#route"/>
      </animateMotion>
    </circle>

    <!-- 왼쪽: 이름과 역할 -->
    <text x="64" y="78" class="mono in d1" font-size="14" letter-spacing="3" fill="#5EEAD4">AI ENGINEER · FULL-STACK · PM</text>
    <text x="60" y="160" class="sans in d2" font-size="76" font-weight="800" fill="#F1F5F9">이승규</text>
    <text x="300" y="160" class="sans in d3" font-size="26" font-weight="500" fill="#94A3B8">Lee Seung-gyu</text>
    <rect x="64" y="184" width="64" height="4" rx="2" fill="url(#accent)" class="in d3"/>

    <g class="sans" font-size="24" font-weight="600" fill="#E2E8F0">
      <text x="64" y="236" class="role r1">LLM 에이전트를 설계하고, 평가 기준까지 만듭니다</text>
      <text x="64" y="236" class="role r2">AI 기능을 실제로 돌아가는 서비스로 엮어냅니다</text>
      <text x="64" y="236" class="role r3">실패한 이유를 데이터로 찾아 숫자로 말합니다</text>
    </g>
    <text x="64" y="276" class="mono in d4" font-size="14" fill="#64748B">$ open ./portfolio<tspan class="caret" fill="#5EEAD4"> ▍</tspan></text>

    <!-- 오른쪽: 대표 숫자 카드 -->
    <g class="in d4"><g class="float1">
      <rect x="760" y="52" width="220" height="76" rx="14" fill="#0B1628" stroke="#2DD4BF" stroke-opacity="0.45"/>
      <text x="780" y="90" class="mono" font-size="26" font-weight="700" fill="#5EEAD4">0.938</text>
      <text x="780" y="114" class="sans" font-size="13" fill="#94A3B8">LLM 에이전트 작업 선택 정확도</text>
    </g></g>
    <g class="in d5"><g class="float2">
      <rect x="952" y="140" width="220" height="76" rx="14" fill="#0B1628" stroke="#60A5FA" stroke-opacity="0.45"/>
      <text x="972" y="178" class="mono" font-size="24" font-weight="700" fill="#93C5FD">58.8→30.4%</text>
      <text x="972" y="202" class="sans" font-size="13" fill="#94A3B8">자율주행 급커브 저신뢰 프레임</text>
    </g></g>
    <g class="in d6"><g class="float3">
      <rect x="840" y="222" width="220" height="76" rx="14" fill="#0B1628" stroke="#FBBF24" stroke-opacity="0.45"/>
      <text x="860" y="260" class="mono" font-size="26" font-weight="700" fill="#FCD34D">Top 12%</text>
      <text x="860" y="284" class="sans" font-size="13" fill="#94A3B8">LG Aimers 7기 수요 예측</text>
    </g></g>
  </g>
</svg>
