<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="14" viewBox="0 0 1200 14">
  <defs>
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2DD4BF" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#2DD4BF" stop-opacity="1"/>
      <stop offset="1" stop-color="#60A5FA" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <style>
    .s { animation: run 4.5s cubic-bezier(.4,0,.2,1) infinite; }
    @keyframes run { from { transform: translateX(-320px) } to { transform: translateX(1200px) } }
  </style>
  <rect x="0" y="6" width="1200" height="2" rx="1" fill="#94A3B8" opacity="0.25"/>
  <rect class="s" x="0" y="5" width="320" height="4" rx="2" fill="url(#shine)"/>
  <circle cx="600" cy="7" r="3.5" fill="#2DD4BF"/>
</svg>
